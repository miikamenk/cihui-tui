[package]
name = "cihui-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
pinyin = "0.11"
image = "0.25"
arboard = { version = "3.4", features = ["image"] }
reqwest = { version = "0.13", features = ["json", "multipart", "blocking"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "rt", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3.14"
urlencoding = "2.1"
once_cell = "1.19"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }

[dependencies.ocr-rs]
git = "https://github.com/zibo-chen/rust-paddle-ocr.git"
