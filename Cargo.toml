[package]
name = "cihui-tui"
version = "0.1.0"
edition = "2021"

[lib]
name = "cihui_tui"
path = "src/lib.rs"

[[bin]]
name = "cihui-ocr"
path = "src/bin/cihui-ocr.rs"
required-features = ["ocr"]

[[bin]]
name = "cihui-transcribe"
path = "src/bin/cihui-transcribe.rs"
required-features = ["transcription"]

[features]
default = ["ocr", "transcription"]
transcription = ["whisper-rs", "cpal", "hf-hub"]
ocr = ["ocr-rs", "arboard", "image"]
vulkan = ["whisper-rs?/vulkan"]
cuda = ["whisper-rs?/cuda"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
pinyin = "0.11"
reqwest = { version = "0.13", features = ["json", "multipart", "blocking"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "rt", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3.14"
urlencoding = "2.1"
once_cell = "1.19"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }

# OCR dependencies (optional)
image = { version = "0.25", optional = true }
arboard = { version = "3.4", features = ["image"], optional = true }
ocr-rs = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", optional = true }

# Transcription dependencies (optional)
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.15", optional = true }
hf-hub = { version = "0.5", optional = true }

[dev-dependencies]
insta = "1"
wiremock = "0.6"
pretty_assertions = "1"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time"] }
